<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiftReplay — First Shift</title>
    <meta name="description" content="Browser-only 3D safety sim. Make the call, see the consequence, learn the rule." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div class="grain" aria-hidden="true"></div>

    <div id="hud" class="hidden">
      <aside id="mission">
        <div class="k" id="mission-k">MISSION</div>
        <div id="mission-role"></div>
        <div id="objective-text"></div>
        <div id="distance"></div>
        <div class="k" id="milestones-k">MILESTONES</div>
        <ol id="milestones"></ol>
      </aside>
      <aside id="status">
        <div class="row"><span id="timer">0:00</span><span class="lbl" id="timer-lbl"></span></div>
        <div class="row"><span id="near-count">0</span><span class="lbl" id="near-lbl"></span></div>
        <div class="row ctl"><button id="view" type="button" title="View (V)">3rd</button><button id="sound" type="button">♪</button><button id="lang" type="button">ID</button></div>
      </aside>
      <div id="compass"><div id="compass-track"><span>S</span><span>W</span><span>N</span><span>E</span><span>S</span><span>W</span><span>N</span><span>E</span><span>S</span><span>W</span><span>N</span><span>E</span></div><div class="tick"></div></div>
      <div id="crosshair"></div>
      <div id="hint"></div>
    </div>

    <div id="flash"></div>
    <div id="replay-banner" class="hidden"><span class="tag" id="replay-tag">REPLAY</span><span id="replay-caption"></span><span class="tele hidden" id="replay-tele"></span></div>
    <div id="toast" class="hidden"></div>
    <div id="gauge" class="hidden"></div>

    <div id="decision" class="hidden"></div>
    <div id="action" class="hidden"></div>

    <div id="overlay-start" class="overlay">
      <div class="panel wide">
        <div class="brand-row"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M43.3 20.7A16 16 0 1 0 48 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square"/><path d="M38.5 12.5l13 3.4-4.4 12.6z" fill="currentColor"/><path d="M27.5 24.5v15l12.5-7.5z" fill="var(--accent)"/></svg><span>shiftreplay</span><span class="where">/ container terminal</span></div>
        <h1>First Shift</h1>
        <p id="start-lead"></p>
        <div id="loading" role="status" aria-live="polite"><div class="bar"><i id="loading-fill"></i></div><span id="loading-text">Loading the terminal…</span></div>
        <h2 id="role-title"></h2>
        <div id="roles"></div>
        <svg width="0" height="0" style="position:absolute"><defs>
          <symbol id="ic-hat" viewBox="0 0 24 24"><path d="M3 15h18v2H3zM5 14a7 7 0 0 1 14 0H5z" fill="currentColor"/><path d="M11 5h2v5h-2z" fill="currentColor"/></symbol>
          <symbol id="ic-truck" viewBox="0 0 24 24"><path d="M2 6h11v9H2zM13 9h5l3 3v3h-8z" fill="currentColor"/><circle cx="6" cy="17" r="2" fill="currentColor"/><circle cx="17" cy="17" r="2" fill="currentColor"/></symbol>
          <symbol id="ic-ship" viewBox="0 0 24 24"><path d="M3 14l2 5h14l2-5zM5 13V8h14v5zM11 4h2v4h-2z" fill="currentColor"/></symbol>
          <symbol id="ic-wheel" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 0 1 6.9 6h-4.1a3 3 0 0 0-5.6 0H5.1A7 7 0 0 1 12 5zm-6.9 8h4.1a3 3 0 0 0 1.8 2.2v3.7A7 7 0 0 1 5.1 13zm7.8 5.9v-3.7a3 3 0 0 0 1.8-2.2h4.1a7 7 0 0 1-5.9 5.9z" fill="currentColor"/></symbol>
          <symbol id="ic-crane" viewBox="0 0 24 24"><path d="M3 3h18v3H3zM4 6h2v15H4zM18 6h2v15h-2zM11 6h2v6h-2zM8 12h8v5H8z" fill="currentColor"/></symbol>
          <symbol id="ic-hand" viewBox="0 0 24 24"><path d="M9 2h2v9h1V3h2v8h1V5h2v9a7 7 0 0 1-7 7H9a5 5 0 0 1-5-5v-4h2v3h1V4h2z" fill="currentColor"/></symbol>
          <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="currentColor"/></symbol>
          <symbol id="ic-alarm" viewBox="0 0 24 24"><path d="M12 2l10 18H2zM11 9v6h2V9zm0 7v2h2v-2z" fill="currentColor"/></symbol>
        </defs></svg>
        <p class="fine" id="start-fine"></p>
        <p class="disclaimer" id="start-disclaimer"></p>
        <a class="back" href="/">← shiftreplay.pages.dev</a>
      </div>
    </div>
    <div id="overlay-end" class="overlay hidden"></div>
    <div id="overlay-unsupported" class="overlay hidden">
      <div class="panel">
        <div class="brand-row"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M43.3 20.7A16 16 0 1 0 48 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square"/><path d="M38.5 12.5l13 3.4-4.4 12.6z" fill="currentColor"/><path d="M27.5 24.5v15l12.5-7.5z" fill="var(--accent)"/></svg><span>shiftreplay</span></div>
        <h1 id="unsupported-title"></h1>
        <p id="unsupported-body"></p>
        <div class="actions"><a class="primary" href="/" id="unsupported-home"></a><button type="button" class="ghost" id="unsupported-anyway"></button></div>
      </div>
    </div>

    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
